# Copy to `secrets.toml` at the repo root and fill in what you need.
# `secrets.toml` is gitignored. Every key is loaded into the process environment
# by load_api_key() (knowledge_storm/utils.py), so anything read via os.getenv
# can be set here. Values can equally be exported as environment variables.
#
# Only the "Required" block is needed for a default run.


# ---------------------------------------------------------------------------
# Required
# ---------------------------------------------------------------------------

# Main chat model. Used by get_llm() in knowledge_storm/langfuse_llm.py, which
# every LLM call site goes through. Any OpenAI-compatible endpoint works.
AZURE_OPENAI_ENDPOINT = "https://<your-resource>.openai.azure.com/openai/v1"
AZURE_OPENAI_API_KEY = ""

# Web search. Serper is the default retriever (--costorm_retriever serper).
SERPER_API_KEY = ""


# ---------------------------------------------------------------------------
# Prompts
# ---------------------------------------------------------------------------
# Prompts ship in `prompts/` as a JSON snapshot, so no Langfuse account is
# needed. DATASTORM_PROMPT_SOURCE: "auto" (Langfuse if credentials are set,
# else the snapshot), "local" (always the snapshot -- use this to reproduce a
# published run), or "langfuse" (require Langfuse).

DATASTORM_PROMPT_SOURCE = "auto"
# DATASTORM_PROMPTS_DIR = ""     # override the snapshot location

# Only needed for DATASTORM_PROMPT_SOURCE = "langfuse", or to trace runs.
LANGFUSE_SECRET_KEY = ""
LANGFUSE_PUBLIC_KEY = ""
LANGFUSE_HOST = ""


# ---------------------------------------------------------------------------
# Datatalk SQL agent
# ---------------------------------------------------------------------------

# Root holding one directory per domain. See README, "Per-domain data".
# Defaults to <repo>/datatalk_domains.
DATATALK_DOMAINS_ROOT = ""

# Azure Maps, for location entity resolution. Optional.
AZURE_MAP_KEY = ""

# Entity retriever for domains that use one. Leave blank to disable.
DATATALK_ENTITY_RETRIEVER_ENDPOINT = ""

# Optional: prefix that turns an uploaded CSV URL into a browsable viewer link,
# and a SQL console for "open this query" links. Both blank = raw URLs.
DATATALK_VIEWER_URL = ""
DATATALK_SQL_CONSOLE_URL = ""

# Host that serves uploaded result CSVs, used to recognise a citation as a
# database result. Blank disables the table-citation rewrite.
DATATALK_CSV_HOST = ""


# ---------------------------------------------------------------------------
# SUQL (free-text-aware SQL)
# ---------------------------------------------------------------------------
# Only needed for domains with suql_enabled = true in db_details.json.

SUQL_EMBEDDING_SERVER = "http://127.0.0.1:8505"
SUQL_FREE_TEXT_SERVER = "http://127.0.0.1:8510"
DATASTORM_SUQL_API_BASE = "https://api.openai.com/v1"
DATASTORM_LITELLM_API_KEY = ""
DATASTORM_SMALLER_LITELLM_API_KEY = ""


# ---------------------------------------------------------------------------
# Optional: CSV upload
# ---------------------------------------------------------------------------
# SQL-result CSVs can be uploaded to Azure Blob Storage and cited by URL.
# Leave blank and pass --disable_upload_to_azure to skip uploads.

AZURE_SAS_TOKEN = ""
AZURE_STORAGE_DEST = ""


# ---------------------------------------------------------------------------
# Optional: embeddings
# ---------------------------------------------------------------------------

ENCODER_API_TYPE = "azure"          # "azure" or "openai"
AZURE_API_VERSION = "2024-08-01-preview"
OPENAI_API_KEY = ""
OPENAI_BASE_URL = ""


# ---------------------------------------------------------------------------
# Optional: alternative retrievers (pass the matching --costorm_retriever)
# ---------------------------------------------------------------------------

BING_SEARCH_API_KEY = ""   # bing
BRAVE_API_KEY = ""         # brave
TAVILY_API_KEY = ""        # tavily
YDC_API_KEY = ""           # you
SEARXNG_API_KEY = ""       # searxng
# duckduckgo needs no key.


# ---------------------------------------------------------------------------
# Optional: alternative LLM providers (legacy dspy layer, knowledge_storm/lm.py)
# ---------------------------------------------------------------------------

OPENAI_API_TYPE = "azure"
AZURE_API_KEY = ""
AZURE_API_BASE = ""
ANTHROPIC_API_KEY = ""
GOOGLE_API_KEY = ""
GROQ_API_KEY = ""
DEEPSEEK_API_KEY = ""
TOGETHER_API_KEY = ""
TOGETHER_API_BASE = ""


# ---------------------------------------------------------------------------
# Optional: paths used by the evaluation harnesses in eval/
# ---------------------------------------------------------------------------

DATASTORM_ACLED_RUNS = ""        # full ACLED run directories (see results/README.md)
DATASTORM_SQL_RESULTS_DIR = ""   # defaults to <repo>/sql_results
DATASTORM_DEBUG_LOG = ""         # defaults to <repo>/log/debug_rm.log
INSIGHT_BENCH_ROOT = ""          # clone of the InsightBench harness
INSIGHT_BENCH_NOTEBOOKS = ""     # InsightBench data/notebooks directory
RESUMMARIZE_MODEL = ""           # defaults to gpt-5
